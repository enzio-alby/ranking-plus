<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>

  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a2e">Ranking+ — Topologia: Desenvolvimento Local × Produção (GCP)</text>

  <!-- ============ LOCAL (esquerda) ============ -->
  <rect x="40" y="80" width="620" height="860" rx="14" fill="#fff8f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="350" y="115" text-anchor="middle" font-size="20" font-weight="700" fill="#a85a00">Ambiente Local (Desenvolvimento)</text>
  <text x="350" y="138" text-anchor="middle" font-size="13" fill="#7a5230">Laragon — Windows</text>

  <!-- Browser local -->
  <rect x="90" y="170" width="520" height="70" rx="10" fill="#ffffff" stroke="#a85a00" stroke-width="1.5"/>
  <text x="350" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Navegador</text>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#555">http://localhost:4000/html/index.html</text>

  <line x1="350" y1="240" x2="350" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="265" font-size="11" fill="#555">fetch() REST/JSON</text>

  <!-- Node local -->
  <rect x="90" y="280" width="520" height="140" rx="10" fill="#fff1de" stroke="#a85a00" stroke-width="1.5"/>
  <text x="350" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Node.js + Express — porta 4000</text>
  <text x="350" y="330" text-anchor="middle" font-size="12" fill="#555">Backend/api2.js  (~1.500 linhas, 35+ rotas)</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#555">express.static serve html/ css/ javascript/ images/</text>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#555">mysql2 · nodemailer · multer · pdf-parse · crypto</text>
  <text x="350" y="400" text-anchor="middle" font-size="11" fill="#8a6a3a" font-style="italic">.env: DB_HOST=localhost</text>

  <line x1="350" y1="420" x2="350" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="445" font-size="11" fill="#555">mysql2/promise</text>

  <!-- MySQL local -->
  <rect x="90" y="460" width="250" height="110" rx="10" fill="#ffffff" stroke="#a85a00" stroke-width="1.5"/>
  <text x="215" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#333">MySQL (Laragon)</text>
  <text x="215" y="510" text-anchor="middle" font-size="12" fill="#555">localhost:3306</text>
  <text x="215" y="530" text-anchor="middle" font-size="12" fill="#555">db: universidade_ranking</text>
  <text x="215" y="550" text-anchor="middle" font-size="12" fill="#555">33 tabelas</text>

  <!-- Gmail SMTP local -->
  <rect x="360" y="460" width="250" height="110" rx="10" fill="#ffffff" stroke="#a85a00" stroke-width="1.5"/>
  <text x="485" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Gmail SMTP</text>
  <text x="485" y="510" text-anchor="middle" font-size="12" fill="#555">nodemailer</text>
  <text x="485" y="530" text-anchor="middle" font-size="12" fill="#555">App Password</text>
  <text x="485" y="550" text-anchor="middle" font-size="12" fill="#555">OTP / suporte</text>

  <!-- Repositorio git local -->
  <rect x="90" y="610" width="520" height="90" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="350" y="638" text-anchor="middle" font-size="14" font-weight="600" fill="#444">Pasta local do projeto (RANKING+)</text>
  <text x="350" y="660" text-anchor="middle" font-size="11" fill="#666">Backend/ · html/ · css/ · javascript/ · images/ · docs/ · infra/terraform/</text>
  <text x="350" y="680" text-anchor="middle" font-size="11" fill="#666">banco_sql/ (schema + migrations) · .env local (não versionado)</text>

  <line x1="350" y1="700" x2="350" y2="740" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="725" font-size="11" fill="#555">git push (Contents API)</text>

  <!-- GitHub -->
  <rect x="90" y="740" width="520" height="90" rx="10" fill="#eef1ff" stroke="#4a5aa8" stroke-width="1.5"/>
  <text x="350" y="768" text-anchor="middle" font-size="14" font-weight="600" fill="#2a3570">GitHub</text>
  <text x="350" y="790" text-anchor="middle" font-size="11" fill="#3a4590">enzio-alby/ranking-plus (branch atualizacao-8sem-p4)</text>
  <text x="350" y="808" text-anchor="middle" font-size="11" fill="#3a4590">CAMPUSCEUB/rankingPlus (docs/board — branch 8_semestre_p4)</text>

  <!-- deploy manual -->
  <line x1="610" y1="785" x2="900" y2="785" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="700" y="775" text-anchor="middle" font-size="11" fill="#666">scp / npm ci (deploy manual pontual)</text>

  <text x="350" y="880" text-anchor="middle" font-size="11" fill="#a85a00" font-style="italic">Node.js 18+ local · sem HTTPS · sem systemd · reinício manual</text>

  <!-- ============ GCP (direita) ============ -->
  <rect x="720" y="80" width="640" height="860" rx="14" fill="#f0f6ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="1040" y="115" text-anchor="middle" font-size="20" font-weight="700" fill="#1a4a80">Produção — Google Cloud Platform</text>
  <text x="1040" y="138" text-anchor="middle" font-size="13" fill="#3a5f8a">Projeto rankingplus · região us-central1</text>

  <!-- Internet / DNS -->
  <rect x="770" y="170" width="540" height="70" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="1040" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Internet — DNS (GoDaddy)</text>
  <text x="1040" y="220" text-anchor="middle" font-size="12" fill="#555">rankingplus.site / www → A record → IP estático</text>

  <line x1="1040" y1="240" x2="1040" y2="275" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1060" y="262" font-size="11" fill="#555">HTTPS :443</text>

  <!-- Firewall -->
  <rect x="770" y="275" width="540" height="55" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/>
  <text x="1040" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#a83226">Firewall (VPC dedicada)</text>
  <text x="1040" y="317" text-anchor="middle" font-size="11" fill="#7a2318">80/443 públicos · SSH só via Identity-Aware Proxy (sem porta 22 exposta)</text>

  <line x1="1040" y1="330" x2="1040" y2="365" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VM box -->
  <rect x="760" y="365" width="560" height="330" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="1040" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4a80">VM rankingplus-vm</text>
  <text x="1040" y="412" text-anchor="middle" font-size="11" fill="#3a5f8a">Compute Engine · e2-small · Ubuntu 24.04 LTS · IP estático</text>

  <!-- nginx -->
  <rect x="790" y="430" width="500" height="80" rx="8" fill="#e8f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  <text x="1040" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#1e5c3a">nginx (TLS via certbot / Let's Encrypt)</text>
  <text x="1040" y="475" text-anchor="middle" font-size="11" fill="#2e5c3a">serve html/ css/ javascript/ images/ · redireciona /html/*.html → /*.html</text>
  <text x="1040" y="493" text-anchor="middle" font-size="11" fill="#2e5c3a">location /api/ → proxy_pass 127.0.0.1:4000</text>

  <line x1="1040" y1="510" x2="1040" y2="545" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node prod -->
  <rect x="790" y="545" width="500" height="90" rx="8" fill="#eef1ff" stroke="#4a5aa8" stroke-width="1.4"/>
  <text x="1040" y="570" text-anchor="middle" font-size="14" font-weight="600" fill="#2a3570">Node.js 24 (LTS) — porta interna 4000</text>
  <text x="1040" y="590" text-anchor="middle" font-size="11" fill="#3a4590">Backend/api.js (cópia do api2.js + .env apontando pro Cloud SQL)</text>
  <text x="1040" y="608" text-anchor="middle" font-size="11" fill="#3a4590">gerenciado por systemd: rankingplus-api.service</text>
  <text x="1040" y="625" text-anchor="middle" font-size="10" fill="#6a5aa0" font-style="italic">restart automático · enable no boot · log em Backend/logs/</text>

  <text x="1040" y="665" text-anchor="middle" font-size="11" fill="#3a5f8a">service account dedicada (sem roles de projeto) · npm audit fix aplicado</text>
  <text x="1040" y="683" text-anchor="middle" font-size="11" fill="#3a5f8a">SMTP (Gmail App Password) configurado direto na VM</text>

  <line x1="1040" y1="695" x2="1040" y2="730" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1060" y="717" font-size="11" fill="#555">mysql2 — IP privado (VPC peering)</text>

  <!-- Cloud SQL -->
  <rect x="770" y="730" width="540" height="110" rx="10" fill="#fff8e6" stroke="#b8860b" stroke-width="1.6"/>
  <text x="1040" y="758" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6400">Cloud SQL — rankingplus-db</text>
  <text x="1040" y="778" text-anchor="middle" font-size="12" fill="#6a4c00">MySQL 8.0 · db-custom-1-3840 (1 vCPU / 3.75GB)</text>
  <text x="1040" y="796" text-anchor="middle" font-size="12" fill="#6a4c00">banco: universidade_ranking (33 tabelas, dados reais)</text>
  <text x="1040" y="814" text-anchor="middle" font-size="12" font-weight="600" fill="#a83226">SEM IP público — só alcançável pela VM via rede privada</text>

  <text x="1040" y="880" text-anchor="middle" font-size="11" fill="#1a4a80" font-style="italic">Terraform em RANKING+/infra/terraform/ reproduz esta arquitetura (validado, não gerencia os recursos atuais)</text>

  <!-- legenda -->
  <rect x="40" y="960" width="18" height="18" fill="#fff1de" stroke="#a85a00"/>
  <text x="65" y="974" font-size="12" fill="#333">Camada local</text>
  <rect x="200" y="960" width="18" height="18" fill="#eef1ff" stroke="#4a5aa8"/>
  <text x="225" y="974" font-size="12" fill="#333">Aplicação</text>
  <rect x="340" y="960" width="18" height="18" fill="#e8f4ea" stroke="#2e8b57"/>
  <text x="365" y="974" font-size="12" fill="#333">Servidor web</text>
  <rect x="480" y="960" width="18" height="18" fill="#fff8e6" stroke="#b8860b"/>
  <text x="505" y="974" font-size="12" fill="#333">Banco de dados</text>
  <rect x="640" y="960" width="18" height="18" fill="#fff5f5" stroke="#c0392b"/>
  <text x="665" y="974" font-size="12" fill="#333">Segurança de rede</text>
</svg>
